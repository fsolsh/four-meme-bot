server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/four_meme?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  web:
    resources:
      cache:
        period: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

# ===== 区块链配置（BSC 主网） =====
web3:
  rpc-pool:
    - https://bsc-dataseed.bnbchain.org
    - https://bsc-dataseed.nariox.org
    - https://bsc-dataseed.defibit.io
    - https://bsc-dataseed.ninicoin.io
    - https://bsc-rpc.publicnode.com
    - https://rpc.ankr.com/bsc
  chain-id: 56
  connect-timeout-seconds: 30
  read-timeout-seconds: 60
  write-timeout-seconds: 60
  max-retries: 3
  retry-delay-ms: 1000

# ===== 合约地址（BSC 主网官方地址） =====
contract:
  four-meme-proxy: "0x5c952063c7fc8610FFDB798152D69F0B9550762b"
  pancake-router-v2: "0x10ED43C718714eb63d5aA57B78B54704E256024E"
  pancake-factory-v2: "0xca143ce32fe78f1f7019d7d551a6402fc5350c73"

# ===== Four.meme 官方免费API =====
# ⚠️ 该 API 对部分地区的 IP 返回 403，无法访问时毕业检测会自动降级为链上查询
four-meme:
  api:
    base-url: https://four.meme/meme-api

# ===== 机器人配置 =====
bot:
  default:
    gas-limit:
      buy: 500000
      sell: 500000
  graduation:
    check-interval-ms: 30000

# ===== 加密密钥（用于私钥/助记词AES加密存储） =====
# ⚠️ 生产环境请改为强密钥并通过环境变量注入
encryption:
  aes-key: "MySuperSecretKey0123456789ABCDEF"

# ===== JWT 配置 =====
jwt:
  # 至少 32 字符，生产环境请改用环境变量注入
  secret: "FourMemeVolumeBotSecretKey_ChangeMeInProduction_2026"
  # 完整 token 有效期（小时）
  expire-hours: 24
  # 临时 token 有效期（分钟），用于 TOTP 绑定流程
  temp-expire-minutes: 10

# ===== Swagger / OpenAPI =====
springdoc:
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html